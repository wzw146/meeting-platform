<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<title>会议进度</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 20px;text-align:center}
.header h1{font-size:17px;font-weight:600;color:#0f172a}
.header .sub{font-size:12px;color:#94a3b8;margin-top:4px}
.banner{background:#dbeafe;padding:10px 16px;text-align:center;font-size:13px;color:#1d4ed8;border-bottom:1px solid #bfdbfe;line-height:1.5}
.container{max-width:600px;margin:0 auto;padding:16px 16px 60px}
.card{background:#fff;border-radius:10px;border:1px solid #e2e8f0;margin-bottom:16px;overflow:hidden}
.card.completed{border-color:#86efac;background:linear-gradient(135deg,#f0fdf4,#f0fdf4);box-shadow:0 0 0 1px #86efac}
.card.terminated{border-color:#fca5a5;background:linear-gradient(135deg,#fef2f2,#fef2f2);box-shadow:0 0 0 1px #fca5a5}
.card-header{padding:16px 20px 8px}
.card-name{font-size:16px;font-weight:600;color:#0f172a}
.card-meta{display:flex;gap:16px;font-size:13px;color:#64748b;margin-top:6px;flex-wrap:wrap}
.status-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:500;margin-top:8px}
.status-badge.active{background:#dbeafe;color:#1d4ed8}
.status-badge.completed{background:#dcfce7;color:#15803d}
.status-badge.terminated{background:#fecaca;color:#b91c1c}
.divider{height:1px;background:#f1f5f9;margin:0 20px}
.stages-wrap{padding:16px 12px;overflow-x:auto}
.stages-row{display:flex;align-items:flex-start;gap:0;min-width:min-content;justify-content:center}
.stage{display:flex;flex-direction:column;align-items:center;position:relative;cursor:pointer;flex-shrink:0;min-width:72px;padding:0 2px;-webkit-tap-highlight-color:transparent;user-select:none}
.stage.disabled{opacity:.5;cursor:not-allowed}
.stage-circle{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border:2.5px solid #cbd5e1;background:#fff;color:#94a3b8;transition:all .2s;position:relative;z-index:1}
.stage.done .stage-circle{background:#16a34a;border-color:#16a34a;color:#fff}
.stage-label{font-size:11px;color:#64748b;margin-top:5px;white-space:nowrap;text-align:center;line-height:1.3;max-width:72px}
.stage.done .stage-label{color:#15803d;font-weight:500}
.stage-date{font-size:10px;color:#94a3b8;margin-top:2px}
.stage.done .stage-date{color:#16a34a}
.connector{width:20px;height:2px;background:#cbd5e1;flex-shrink:0;margin-top:16px}
.stage.done+.connector{background:#16a34a}
.note{padding:12px 20px;font-size:12px;color:#dc2626;border-top:1px solid #f1f5f9}
.empty{text-align:center;padding:80px 20px;color:#94a3b8}
.empty h2{font-size:18px;font-weight:500;margin-bottom:8px;color:#64748b}
.loading{text-align:center;padding:60px;color:#94a3b8;font-size:14px}
.loading .spinner{display:inline-block;width:24px;height:24px;border:3px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin .6s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>
<script>
var STAGES=[
  {key:'oa_application',label:'OA申请'},
  {key:'agreement_seal',label:'协议盖章'},
  {key:'medical_info_app',label:'医信申请'},
  {key:'meeting_held',label:'会议举办'},
  {key:'online_materials',label:'线上材料提交'},
  {key:'offline_materials',label:'线下材料提交'},
  {key:'meeting_payment',label:'会议打款'},
  {key:'invoice_retrieval',label:'取回发票'},
  {key:'meeting_approval',label:'会议核销'}
];
var shareId=(window.location.pathname.match(/^\/shared\/([a-z0-9-]+)/)||[])[1];
var _loading=false;

function q(u){return fetch(u).then(function(r){if(!r.ok)return r.json().then(function(e){throw Error(e.error||'请求失败')});return r.json()})}
function p(u,b){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){if(!r.ok)return r.json().then(function(e){throw Error(e.error||'请求失败')});return r.json()})}

function showLoading(){
  var root=document.getElementById('root');
  root.innerHTML='<div class="loading"><div class="spinner"></div><div>加载中...</div></div>';
}

function showEmpty(msg){
  document.getElementById('root').innerHTML='<div class="empty"><h2>'+(msg||'无法加载')+'</h2></div>';
}

function load(){
  if(_loading)return;
  if(!shareId){showEmpty('链接无效');return}
  _loading=true;
  showLoading();
  q('/api/share/'+shareId).then(function(m){
    _loading=false;
    render(m);
  }).catch(function(e){
    _loading=false;
    showEmpty('该会议已删除或链接无效');
  });
}

function render(m){
  var root=document.getElementById('root');
  root.innerHTML='';

  // Header
  var hd=document.createElement('div');hd.className='header';
  var h1=document.createElement('h1');h1.textContent=m.name;
  var sb=document.createElement('div');sb.className='sub';sb.textContent='会议进度';
  hd.appendChild(h1);hd.appendChild(sb);root.appendChild(hd);

  // Banner
  var bn=document.createElement('div');bn.className='banner';
  bn.textContent='点击流程节点可标记完成，实时同步至发起人';
  root.appendChild(bn);

  // Container
  var ct=document.createElement('div');ct.className='container';

  var c1=m.status==='terminated';var c2=m.status==='completed';
  var stxt={active:'进行中',completed:'已完成',terminated:'已终止'}[m.status]||'进行中';
  var cnt=0;STAGES.forEach(function(s){if(m.stages[s.key]&&m.stages[s.key].completed)cnt++});

  var cd=document.createElement('div');
  cd.className='card'+(c2?' completed':'')+(c1?' terminated':'');

  var ch=document.createElement('div');ch.className='card-header';
  var cn=document.createElement('div');cn.className='card-name';cn.textContent=m.name;
  var cm=document.createElement('div');cm.className='card-meta';
  var d1=document.createElement('span');d1.textContent='\uD83D\uDCC5 '+m.date;
  var d2=document.createElement('span');d2.textContent='\uD83D\uDC64 '+m.personInCharge;
  var d3=document.createElement('span');d3.style.cssText='color:#64748b;font-size:12px';d3.textContent=cnt+'/'+STAGES.length;
  cm.appendChild(d1);cm.appendChild(d2);cm.appendChild(d3);
  var sb2=document.createElement('span');sb2.className='status-badge '+m.status;sb2.textContent=stxt;
  ch.appendChild(cn);ch.appendChild(cm);ch.appendChild(sb2);cd.appendChild(ch);

  var sw=document.createElement('div');sw.className='stages-wrap';
  var sr=document.createElement('div');sr.className='stages-row';

  STAGES.forEach(function(s,i){
    var sg=m.stages[s.key]||{completed:false,date:null};
    var sd=document.createElement('div');
    sd.className='stage'+(sg.completed?' done':'')+((c1||c2)?' disabled':'');
    if(!c1&&!c2)sd.onclick=function(){
      if(_loading)return;
      p('/api/share/'+shareId+'/sync',{stageKey:s.key,completed:!sg.completed})
        .then(function(){load()})
        .catch(function(e){alert('操作失败: '+e.message)});
    };
    var sc=document.createElement('div');sc.className='stage-circle';
    sc.textContent=sg.completed?'\u2713':String(i+1);
    sd.appendChild(sc);
    var sl=document.createElement('div');sl.className='stage-label';sl.textContent=s.label;
    sd.appendChild(sl);
    if(sg.date){var sdt=document.createElement('div');sdt.className='stage-date';sdt.textContent=sg.date;sd.appendChild(sdt)}
    sr.appendChild(sd);
    if(i<STAGES.length-1){var cn2=document.createElement('div');cn2.className='connector';sr.appendChild(cn2)}
  });
  sw.appendChild(sr);cd.appendChild(document.createElement('div'));cd.lastChild.className='divider';cd.appendChild(sw);
  if(c1&&m.terminatedNote){
    var nn=document.createElement('div');nn.className='note';nn.textContent='\u26A0 '+m.terminatedNote;cd.appendChild(nn)}
  ct.appendChild(cd);root.appendChild(ct);
}

load();
</script>
</body>
</html>
